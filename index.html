<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Prayer Room Display</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="container">
    <div class="header">
      <img src="draxlmaier-group-business-draexlmaier-organization-automotive-industry-business.png" alt="Draxlmaier Logo" class="logo">
      <h1>Prayer Times</h1>
    </div>

    <div id="clock">--:--:--</div>
    <div id="date"></div>

    <div class="prayer-times">
      <div class="prayer" id="Fajr">Fajr <span></span></div>
      <div class="prayer" id="Dhuhr">Dhuhr <span></span></div>
      <div class="prayer" id="Asr">Asr <span></span></div>
      <div class="prayer" id="Maghrib">Maghrib <span></span></div>
      <div class="prayer" id="Isha">Isha <span></span></div>
    </div>

    <div id="next-prayer">Next Prayer: --</div>
  </div>

  <script src="script.js"></script>
</body>
</html>
